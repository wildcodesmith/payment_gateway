<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>x</title>

  <!-- Tailwind CSS -->
  <link href="./src/output.css" rel="stylesheet">

  <!-- Lenis CSS for smooth scrolling physics -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css">

  <!-- GSAP + ScrollTrigger + Lenis JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-black">

  <!-- ================= FIXED BACKGROUND VIDEO ================= -->
  <div class="fixed inset-0 w-full h-full -z-10 overflow-hidden">
    <video
      id="scrollVideo"
      class="w-full h-full object-cover pointer-events-none"
      src="/images/b.mp4"
      muted
      playsinline
      preload="auto">
    </video>
  </div>

  <!-- ================= SCROLLABLE CONTENT CONTAINER ================= -->
  <div id="scroll-container" class="relative z-10 min-h-[500vh]">

    <!-- Section 1 -->
    <section class="h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="max-w-xl p-8 rounded-2xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md shadow-2xl">
        <span class="text-xs font-mono text-cyan-400 uppercase tracking-widest">lorem ipsum</span>
        <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-white mt-2 mb-4">
          lorem ipsum
        </h1>
        <p class="text-sm text-slate-400">
          lorem ipsum
        </p>
      </div>
    </section>

    <!-- Section 2 -->
    <section class="h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="max-w-md p-8 rounded-2xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md shadow-2xl">
        <h2 class="text-2xl font-bold text-white mb-2">lorem ipsum</h2>
        <p class="text-xs text-slate-400">
         Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi, nobis.
        </p>
      </div>
    </section>

    <!-- Section 3 -->
    <section class="h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="max-w-md p-8 rounded-2xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md shadow-2xl">
        <h2 class="text-2xl font-bold text-white mb-2">lorem ipsum</h2>
        <p class="text-xs text-slate-400">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi, nobis.
        </p>
      </div>
    </section>

    <!-- Section 4 -->
    <section class="h-screen flex flex-col items-center justify-center p-6 text-center">
      <div class="max-w-md p-8 rounded-2xl bg-slate-900/60 border border-cyan-500/30 backdrop-blur-md shadow-[0_0_30px_rgba(6,182,212,0.15)]">
        <h2 class="text-2xl font-bold text-cyan-400 mb-2">lorem ipsum</h2>
        <p class="text-xs text-slate-400">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi, nobis.
        </p>
      </div>
    </section>

  </div>

  <!-- ================= GSAP + LENIS ENGINE SCRIPT ================= -->
  <script>
    // 1. Initialize Lenis Smooth Scroll
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      touchMultiplier: 1.5,
    });

    // 2. Connect Lenis to GSAP ScrollTrigger
    gsap.registerPlugin(ScrollTrigger);

    lenis.on('scroll', ScrollTrigger.update);

    gsap.ticker.add((time) => {
      lenis.raf(time * 1000);
    });

    gsap.ticker.lagSmoothing(0);

    // 3. Sync Video Timeline with Scroll Position
    const video = document.getElementById('scrollVideo');

    function initVideoScrub() {
      gsap.to(video, {
        currentTime: video.duration,
        ease: "none",
        scrollTrigger: {
          trigger: "#scroll-container",
          start: "top top",
          end: "bottom bottom",
          scrub: 0.5, // Smooth scrubbing delay (0.5s lerp)
        }
      });
    }

    if (video.readyState >= 1) {
      initVideoScrub();
    } else {
      video.addEventListener('loadedmetadata', initVideoScrub);
    }
  </script>

</body>
</html>
